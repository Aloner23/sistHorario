name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (formato)
        run: ruff format --check .
      - name: Pruebas
        run: pytest
      - name: Verificar dependencias del despliegue en entorno limpio
        run: |
          pip install uv
          uv sync --no-dev
          .venv/bin/python -c "from api.index import app; from app.solver import cpsat_disponible; assert app.title == 'Horarios API'; assert cpsat_disponible()"
